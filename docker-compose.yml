services:
    app:
        container_name: rpg-app
        restart: always
        build:
            dockerfile: ./.docker/app/Dockerfile
            context: .
        ports:
            - "8000:8000"
        networks:
            - app_network
        env_file:
            - .env
        depends_on:
            - pgsql
            - redis
        volumes:
          - .:/var/www

    pgsql:
        container_name: rpg-pgsql
        image: postgres:17-alpine3.20
        ports:
            - "5432:5432"
        networks:
            - app_network
        volumes:
            - 'pgsql:/var/lib/pgsql'
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}

    redis:
        container_name: rpg-redis
        image: redis:7.4.1-alpine3.20
        ports:
            - "6379:6379"
        networks:
            - app_network

    reverb:
        build:
            context: .
            dockerfile: ./.docker/reverb/Dockerfile
        container_name: rpg-reverb
        ports:
            - "8880:8880"
        networks:
            - app_network
        depends_on:
            - app
        volumes:
          - .:/var/www

    vite:
        container_name: rpg-vite
        image: node:26-alpine3.24
        restart: always
        working_dir: /app
        # Same Node image as the asset build stage in .docker/app/Dockerfile.
        # node_modules lives in its own volume: the host's copy holds macOS binaries
        # (rolldown, lightningcss, tailwind oxide) that can't run on Linux.
        command: sh -c "npm install --no-audit --no-fund && exec npm run dev"
        # Makes laravel-vite-plugin listen on 0.0.0.0:5173 (strict port) and write
        # http://localhost:5173 to public/hot, so the browser can reach it.
        environment:
            LARAVEL_SAIL: 1
        init: true
        ports:
            - "5173:5173"
        networks:
            - app_network
        volumes:
            - .:/app
            - node_modules:/app/node_modules

networks:
    app_network:
        driver: bridge

volumes:
    pgsql:
        driver: local
    node_modules:
        driver: local
